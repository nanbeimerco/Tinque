<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヒートの縁取り v3</title>
<style>
  :root { --bg: #121212; --surface: #1d1d1f; --text: #ececec; --sub: #9a9a9a; --line: #2c2c2e; --track: rgba(255,255,255,.16); }
  :root[data-theme="light"] { --bg: #f4f3f1; --surface: #ffffff; --text: #1b1b1b; --sub: #6b6b6b; --line: #dedcd8; --track: rgba(0,0,0,.12); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { color: var(--sub); font-size: 13px; margin: 0 0 16px; line-height: 1.6; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .controls button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .controls button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .group-label { font-size: 12px; color: var(--sub); align-self: center; margin-right: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; }
  section { background: var(--surface); border-radius: 20px; padding: 14px 16px 12px; }
  section h2 { font-size: 15px; margin: 0 0 2px; }
  section p { font-size: 12px; color: var(--sub); margin: 0; line-height: 1.6; min-height: 38px; }
  .row { display: flex; gap: 10px; padding: 16px 4px 4px; }
  .cell { width: 56px; text-align: center; }
  .cap { font-size: 11px; color: var(--sub); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .tile { position: relative; width: 56px; height: 56px; }
  .art { position: absolute; inset: 0; }
  .tile svg { position: absolute; left: -14px; top: -14px; width: 84px; height: 84px; overflow: visible; pointer-events: none; }
  .num { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 12px; text-align: center; line-height: 22px; margin-right: 6px; }
</style>
</head>
<body>
  <h1>ヒートの縁取り v3：4.8 以上の動き方</h1>
  <p class="lead">E1（伸びる線）を土台に、4.8 以上の動き方を並べました。左から アルバム 4.4（動かない基準）・4.8・5.0、アーティスト 4.8・5.0。どれも描き直すのは縁の線だけなので、重さはほぼ同じです。</p>

  <div class="controls">
    <span class="group-label">色</span>
    <button data-hue="22">橙 22°</button>
    <button data-hue="16">赤橙 16°</button>
    <button data-hue="12" class="on">赤橙 12°</button>
    <button data-hue="335">ピンク</button>
  </div>
  <div class="controls">
    <span class="group-label">速さ</span>
    <button data-speed="0.6">ゆっくり</button>
    <button data-speed="1" class="on">ふつう</button>
    <button data-speed="1.6">速め</button>
    <span class="group-label" style="margin-left:10px">動き</span>
    <button id="play" class="on">再生中</button>
    <button id="pause">一時停止</button>
    <span class="group-label" style="margin-left:10px">背景</span>
    <button data-theme="dark" class="on">ダーク</button>
    <button data-theme="light">ライト</button>
  </div>

  <div class="grid" id="patterns"></div>

<script>
  const PATTERNS = [
    { id: "pulse", name: "脈打つ", desc: "線の太さがゆっくり太くなったり細くなったりする（前回の E1）。" },
    { id: "comet", name: "光が走る", desc: "明るい光の粒が、線の上を始点から先端へ走る。5.0 では一周し続ける。" },
    { id: "breathe", name: "息をする", desc: "線の先端が少し伸びたり縮んだりする。5.0 では上のすき間が開いたり閉じたりする。" },
    { id: "flow", name: "色が流れる", desc: "線の明るさのむらが、線に沿ってゆっくり流れる。" },
    { id: "spin", name: "回る", desc: "線の長さはそのままで、線全体がゆっくり回る（M3 の読み込み中の表示に近い）。" },
    { id: "ripple", name: "波紋", desc: "縁の外側に薄い線が広がって消える。数秒に一度。" },
    { id: "spark", name: "先端が光る", desc: "線の先端に光る点があり、ゆっくり明滅する。" },
    { id: "wave", name: "波が出る", desc: "4.8 未満はまっすぐ、4.8 以上で線が細かく波打って流れる（E2 を 4.8 以上だけに使う）。" },
  ];
  const TILES = [
    { level: 4.4, round: false, art: "linear-gradient(135deg,#0f2027,#2c5364)" },
    { level: 4.8, round: false, art: "radial-gradient(circle at 30% 30%,#f6d365,#fda085 60%,#6b3a2a)" },
    { level: 5.0, round: false, art: "linear-gradient(200deg,#d4fc79,#3c8d5a)" },
    { level: 4.8, round: true, art: "linear-gradient(135deg,#2b5876,#4e4376)" },
    { level: 5.0, round: true, art: "linear-gradient(160deg,#e0c3fc,#8ec5fc)" },
  ];
  const ns = "http://www.w3.org/2000/svg";
  let hue = 12, speed = 1, playing = true, t = 0;

  function hsl(level, dl = 0, alpha = 1) {
    const e = Math.pow(Math.min(Math.max(level / 5, 0), 1), 1.6);
    return `hsla(${hue} ${e * 92}% ${(0.70 - e * 0.08) * 100 + dl}% / ${alpha})`;
  }

  // Outline of a rounded rect (circle when r = w/2), walked from top-centre clockwise.
  function outline(w, h, r) {
    const segs = [], sx = w / 2 - r, sy = h - 2 * r, arc = Math.PI * r / 2;
    const corner = (cx, cy, a0) => tt => { const a = a0 + tt / r; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    segs.push({ len: sx, f: tt => [w / 2 + tt, 0] });
    segs.push({ len: arc, f: corner(w - r, r, -Math.PI / 2) });
    segs.push({ len: sy, f: tt => [w, r + tt] });
    segs.push({ len: arc, f: corner(w - r, h - r, 0) });
    segs.push({ len: w - 2 * r, f: tt => [w - r - tt, h] });
    segs.push({ len: arc, f: corner(r, h - r, Math.PI / 2) });
    segs.push({ len: sy, f: tt => [0, h - r - tt] });
    segs.push({ len: arc, f: corner(r, r, Math.PI) });
    segs.push({ len: sx, f: tt => [r + tt, 0] });
    const total = segs.reduce((s, g) => s + g.len, 0);
    return { total, at(s) {
      s = ((s % total) + total) % total;
      for (const g of segs) { if (s <= g.len + 1e-6) return g.f(Math.min(s, g.len)); s -= g.len; }
      return segs[0].f(0);
    } };
  }

  const GAP_OUT = 4, OFF = 14, TILE = 56, STROKE = 2.5;
  function shape(round, grow = 0) {
    const size = TILE + (GAP_OUT + grow) * 2;
    const o = outline(size, size, round ? size / 2 : 12 + GAP_OUT + grow);
    const shift = OFF - GAP_OUT - grow;
    return { total: o.total, at: s => { const [x, y] = o.at(s); return [x + shift, y + shift]; } };
  }
  function pathD(o, from, to, step = 0.75) {
    let d = "";
    for (let s = from; s <= to + 1e-6; s += step) { const [x, y] = o.at(s); d += (d ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2); }
    return d;
  }
  function add(svg, tag, attrs) {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    svg.appendChild(el); return el;
  }
  function line(svg, o, from, to, stroke, width = STROKE, extra = {}) {
    add(svg, "path", { d: pathD(o, from, to), fill: "none", stroke, "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round", ...extra });
  }

  function draw(svg, pattern, tile) {
    svg.innerHTML = "";
    const { level, round } = tile;
    const moving = level >= 4.8;
    const time = moving && playing ? t : 0;
    const o = shape(round);
    const total = o.total, gap = 7, full = level >= 5;
    let start = 0, end = full ? total : total * level / 5;
    let width = STROKE, color = hsl(level);
    const track = getComputedStyle(document.documentElement).getPropertyValue("--track");

    if (moving && pattern === "pulse") width = STROKE + 0.9 * (0.5 + 0.5 * Math.sin(time * 2.4));
    if (moving && pattern === "breathe") {
      if (full) { const g = 5 + 5 * (0.5 + 0.5 * Math.sin(time * 2)); start = g / 2; end = total - g / 2; }
      else end = end * (1 + 0.035 * Math.sin(time * 2));
    }
    if (moving && pattern === "spin") { const shift = (time * 0.25 % 1) * total; start += shift; end += shift; }

    // Track (the part not reached).
    if (!full) line(svg, o, end + gap, start + total - gap, track);

    // Ripple: a ring that grows out and fades.
    if (moving && pattern === "ripple") {
      const p = (time * 0.35) % 1;
      if (p < 0.7) {
        const k = p / 0.7, r = shape(round, 1 + k * 7);
        line(svg, r, 0, r.total, hsl(level, 6), 1.5, { opacity: (1 - k) * 0.7 });
      }
    }

    // The line itself.
    if (moving && pattern === "flow") {
      const step = 2;
      for (let s = start; s < end; s += step) {
        const k = 0.5 + 0.5 * Math.sin((s / total) * Math.PI * 4 - time * 2.2);
        line(svg, o, s, Math.min(end, s + step + 0.6), hsl(level, -6 + 18 * k), width, { "stroke-linecap": "butt" });
      }
    } else if (moving && pattern === "wave") {
      const crests = full ? 14 : 12, wl = total / crests, amp = 1.3, edge = 5;
      let d = "";
      for (let s = start; s <= end; s += 0.6) {
        const [x, y] = o.at(s), [x2, y2] = o.at(s + 0.3);
        const dx = x2 - x, dy = y2 - y, l = Math.hypot(dx, dy) || 1, nx = dy / l, ny = -dx / l;
        const taper = full ? 1 : Math.max(0, Math.min(1, (s - start) / edge, (end - s) / edge));
        const w = Math.sin(s / wl * Math.PI * 2 - time * 2.6) * amp * taper;
        d += (d ? "L" : "M") + (x - nx * w).toFixed(2) + " " + (y - ny * w).toFixed(2);
      }
      add(svg, "path", { d, fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round" });
    } else {
      line(svg, o, start, end, color, width);
    }

    // Comet: a bright run along the line.
    if (moving && pattern === "comet") {
      const len = 14, span = full ? total : end;
      const head = ((time * 0.45) % 1) * (span + (full ? 0 : len));
      for (let i = 0; i < 7; i++) {
        const a = head - (i / 7) * len, b = head - ((i + 1) / 7) * len;
        const from = full ? b : Math.max(0, b), to = full ? a : Math.min(span, a);
        if (to > from) line(svg, o, from, to, `hsla(${hue} 100% 92% / ${(1 - i / 7) * 0.95})`, width + 0.3, { "stroke-linecap": "butt" });
      }
    }

    // Spark at the head.
    if (moving && pattern === "spark") {
      const [x, y] = o.at(full ? 0 : end);
      const k = 0.5 + 0.5 * Math.sin(time * 2.6);
      add(svg, "circle", { cx: x, cy: y, r: 5 + 3 * k, fill: `hsla(${hue} 100% 70% / ${0.18 + 0.2 * k})` });
      add(svg, "circle", { cx: x, cy: y, r: 2.2 + 0.6 * k, fill: `hsla(${hue} 100% 93% / 1)` });
    }
  }

  function render() {
    document.getElementById("patterns").innerHTML = PATTERNS.map((p, i) => `
      <section>
        <h2><span class="num">${i + 1}</span>${p.name}</h2>
        <p>${p.desc}</p>
        <div class="row">${TILES.map((tl, j) => `
          <div class="cell"><div class="tile">
            <div class="art" style="background:${tl.art};border-radius:${tl.round ? "50%" : "12px"}"></div>
            <svg data-p="${p.id}" data-t="${j}"></svg></div>
            <div class="cap">${tl.round ? "人" : "盤"} ${tl.level.toFixed(1)}</div></div>`).join("")}
        </div>
      </section>`).join("");
    drawAll();
  }
  function drawAll() {
    document.querySelectorAll("svg[data-p]").forEach(svg => draw(svg, svg.dataset.p, TILES[+svg.dataset.t]));
  }

  let last = performance.now();
  function tick(now) {
    if (playing) { t += (now - last) / 1000 * speed; drawAll(); }
    last = now;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const pick = (sel, b) => document.querySelectorAll(sel).forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("[data-hue]").forEach(b => b.onclick = () => { hue = +b.dataset.hue; pick("[data-hue]", b); drawAll(); });
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => { speed = +b.dataset.speed; pick("[data-speed]", b); });
  document.getElementById("play").onclick = e => { playing = true; pick("#play,#pause", e.target); };
  document.getElementById("pause").onclick = e => { playing = false; pick("#play,#pause", e.target); drawAll(); };
  document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.theme; pick("[data-theme]", b); drawAll(); });
  document.documentElement.dataset.theme = "dark";
  render();
</script>
</body>
</html>
